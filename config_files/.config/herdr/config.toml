onboarding = false

[ui]
# The scrollbar column sits at the pane's right edge and gets captured by
# terminal-native (shift+drag) selections, clipping the last characters of
# anything copied that way - bitten by this copying an auth URL out of a
# mirrored Codespace pane, where shift+drag is the only mouse selection
# that works while a TUI holds the pane (the mirror forwards plain mouse
# events to TUIs by design). Wheel scrolling still works without it.
pane_scrollbars = false

[ui.toast]
delivery = "system"

# One row per agent instead of the default two (["state_icon", "workspace",
# "tab"] plus ["agent"]). herdr has no setting to hide the agent panel - the
# sidebar's two sections are split by a draggable divider whose ratio is
# clamped to [0.1, 0.9] in both the drag handler and the layout read, so
# agents always keeps at least a tenth of the sidebar. Dragging the divider
# to the bottom and halving each entry's height is as close as it gets.
#
# rows_by_agent.claude is the herdr-claude-usage plugin's layout (lib/herdr.sh),
# written here by hand because its setup action appends its own
# rows_by_agent block and bails when one already exists. The first row is
# still one line per Claude agent: $cu_head is the Claude mark plus the
# workspace name, coloured by state (an invisible tag in the value - U+2061
# working, U+2060 done, U+2062 blocked - drives the rules), in place of
# state_icon and workspace. The three bar rows - context, 5h and 7d limits -
# are only set for the focused Claude agent, and a row with no values
# disappears, so every other agent stays one line. Only the token for the
# current level (ok / warn / hot) is set, which is what picks the colour.
# Without the plugin, $cu_head is empty and Claude rows show just the tab -
# restore ["state_icon", "workspace", "tab"] if it's ever removed.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$cu_head", fg = "#a6e3a1", bold = true, rules = [{ contains = "⁡", fg = "#f9e2af" }, { contains = "⁠", fg = "#94e2d5" }, { contains = "⁢", fg = "#f38ba8" }] }, "tab"],
  [{ token = "$cu_ctx_ok", fg = "#98b17d", dim = true }, { token = "$cu_ctx_warn", fg = "#dec27f" }, { token = "$cu_ctx_hot", fg = "#df919b" }],
  [{ token = "$cu_5h_ok", fg = "#98b17d", dim = true }, { token = "$cu_5h_warn", fg = "#dec27f" }, { token = "$cu_5h_hot", fg = "#df919b" }],
  [{ token = "$cu_7d_ok", fg = "#98b17d", dim = true }, { token = "$cu_7d_warn", fg = "#dec27f" }, { token = "$cu_7d_hot", fg = "#df919b" }],
]

# $pr is the jmarbutt.spaces-pr-status plugin's (lib/herdr.sh): without the
# row it computes PR status but has nowhere to render it. A row disappears
# when none of its tokens have a value, so spaces without a PR cost no extra
# height. The plugin also reports $pr_checks ("✓ 17/17") and $pr_review
# ("review req"); those rows were dropped to keep the sidebar short, since the
# ticket card (prefix+i) shows checks and reviews in full. Add either back as
# its own row, dimmed: herdr joins a row's tokens with " · " and clips at
# sidebar_max_width (36), so sharing a row with $pr cuts its tail off.
#
# $agentctl comes from the ticket agent's tick: what it's doing in a space it
# opened for a ticket ("󰚩 Building · implementPlan since 16:31", "󰚩 HELD · ...").
# Only those spaces get a value, so the row costs nothing anywhere else, and it
# expires a day after the agent's last tick. The leading robot is a Nerd Font glyph
# (nf-md-robot, U+F06A9): the terminal showing herdr needs a Nerd Font, which
# lib/configure_xfce.sh sets up here; anywhere else it shows as a box.
#
# The workspace token dims when its label carries the snooze glyph (nf-md-sleep,
# U+F04B2), which the dotfiles plugin's snooze action adds (herdr-plugin/).
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", rules = [{ contains = "󰒲", dim = true }] }],
  ["branch", "git_status"],
  ["$agentctl"],
  ["$pr"],
]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+space"
# Core split bindings are unbound in favor of the mirror plugin's
# context-aware split actions below (prefix+\ and prefix+minus, the same
# keys) - those split the *remote* pane when invoked inside a mirrored
# Codespace workspace and fall back to a plain local split everywhere
# else, so nothing changes for local work. split_vertical's default was
# prefix+v (remapped to prefix+\ before this), split_horizontal's was
# prefix+minus.
split_vertical = ""
split_horizontal = ""
# Moved off its default prefix+r (see `herdr --default-config`) to free
# that up for the reviewr toggle below - resize is used less often and
# doesn't need a mnemonic letter the way reviewr's "r" does.
resize_mode = "prefix+v"
# Freed for snooze (prefix+l, below). ctrl+l from vim-herdr-navigation
# already focuses the pane to the right, without the prefix.
focus_pane_right = ""

# Unset by default. Direct (no prefix) bindings, not prefix+X - needs to
# work while a Claude session or Neovim has focus, same as vim-herdr-
# navigation's ctrl+hjkl below: herdr grabs direct bindings at the
# multiplexer level before the foreground process ever sees the
# keystroke, same mechanism, not something special-cased per binding.
# alt+shift, not plain alt / ctrl+alt / super: plain alt+j encodes as
# ESC j, so a fast Esc-then-j/k (leaving vim insert mode, escaping a TUI)
# read as alt+j/k and triggered "random" workspace jumps. ctrl+alt+j and
# super+j never registered at all - legacy terminal encoding has no
# distinct sequence for them on letter keys. alt+shift+j (ESC J) does
# register; known tradeoff: a fast Esc-then-J (e.g. escaping vim then
# joining lines) can still misfire the same way plain alt did.
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"

[[keys.command]]
key = "shift+left"
type = "shell"
command = "herdr pane resize --direction left --current --amount 0.02"
description = "resize pane left (tmux-style)"

[[keys.command]]
key = "shift+right"
type = "shell"
command = "herdr pane resize --direction right --current --amount 0.02"
description = "resize pane right (tmux-style)"

[[keys.command]]
key = "shift+up"
type = "shell"
command = "herdr pane resize --direction up --current --amount 0.02"
description = "resize pane up (tmux-style)"

[[keys.command]]
key = "shift+down"
type = "shell"
command = "herdr pane resize --direction down --current --amount 0.02"
description = "resize pane down (tmux-style)"

[[keys.command]]
# Replaces core split_vertical (unbound above): remote-aware split via the
# mirror plugin - splits the remote pane inside a mirrored workspace,
# plain local split anywhere else.
key = "prefix+\\"
type = "plugin_action"
command = "mirror.remote-split-right"
description = "split right (remote-aware)"

[[keys.command]]
# Replaces core split_horizontal (unbound above), same remote-aware deal.
key = "prefix+minus"
type = "plugin_action"
command = "mirror.remote-split-down"
description = "split down (remote-aware)"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "cmd+g"
type = "plugin_action"
command = "chmarax.gitview.toggle"
description = "git view"

[[keys.command]]
# resize_mode above was moved off prefix+r onto prefix+v to make room for
# this. (The earlier "doesn't work in the Claude pane" turned out to be
# unrelated to any of this - reviewr correctly refuses outside a git repo,
# and this session's cwd is ~/code, not a repo itself: `herdr plugin log
# list --plugin persiyanov.reviewr` showed the real stderr.)
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review panel"

[[keys.command]]
# A local plugin, linked with `herdr plugin link` from the private work repo;
# on a machine without it the key does nothing. prefix+i for "info".
key = "prefix+i"
type = "plugin_action"
command = "ticket-card.open"
description = "ticket and PR card"

[[keys.command]]
# The same plugin's other popup: the ticket agent's view of this space's
# ticket, its log, and Hold / Clear hold / Take over / Tick / Halt.
key = "prefix+a"
type = "plugin_action"
command = "ticket-card.agent"
description = "agent view of this space's ticket"

[[keys.command]]
# This repo's own plugin (herdr-plugin/). prefix+l was focus_pane_right,
# unbound above: ctrl+l (vim-herdr-navigation) already does that without the
# prefix. Not prefix+z: that's the built-in zoom.
key = "prefix+l"
type = "plugin_action"
command = "dotfiles.snooze"
description = "snooze this space for a while, or wake it"

[update]
channel = "stable"
