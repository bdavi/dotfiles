onboarding = false

[ui]
# The scrollbar column sits at the pane's right edge and gets captured by
# terminal-native (shift+drag) selections, clipping the last characters of
# anything copied that way - bitten by this copying an auth URL out of a
# mirrored Codespace pane, where shift+drag is the only mouse selection
# that works while a TUI holds the pane (the mirror forwards plain mouse
# events to TUIs by design). Wheel scrolling still works without it.
pane_scrollbars = false

[ui.toast]
delivery = "system"

# One row per agent instead of the default two (["state_icon", "workspace",
# "tab"] plus ["agent"]). herdr has no setting to hide the agent panel - the
# sidebar's two sections are split by a draggable divider whose ratio is
# clamped to [0.1, 0.9] in both the drag handler and the layout read, so
# agents always keeps at least a tenth of the sidebar. Dragging the divider
# to the bottom and halving each entry's height is as close as it gets.
#
# rows_by_agent.claude repeats the same row because it's unclear whether
# herdr ships a built-in three-row override for claude (--default-config
# shows one, commented, where every other commented line is a real default).
# Setting it explicitly is correct either way.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"]]

# Required by the jmarbutt.spaces-pr-status plugin (lib/herdr.sh) - without
# these rows it computes PR status but has nowhere to render it. A row
# disappears when none of its tokens have a value, so spaces without a PR
# cost no extra height, and a merged/closed PR drops back to one line (the
# plugin nulls checks and review once a PR is terminal).
#
# One token per row rather than the plugin README's single
# ["$pr", "$pr_checks", "$pr_review"]. herdr joins a row's tokens with " · ",
# which makes that row up to 36 columns ("◌ #9920 DRAFT · ✓ 17/17 · review
# req") against a sidebar that auto-scales no wider than sidebar_max_width
# (36 by default), so the tail was being clipped. herdr has no separator or
# per-row truncation setting; splitting the row is the only fix that keeps
# every token. Checks and review are dimmed so the space name and PR number
# stay the things the eye lands on.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$pr"],
  [{ token = "$pr_checks", dim = true }],
  [{ token = "$pr_review", dim = true }],
]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+space"
# Core split bindings are unbound in favor of the mirror plugin's
# context-aware split actions below (prefix+\ and prefix+minus, the same
# keys) - those split the *remote* pane when invoked inside a mirrored
# Codespace workspace and fall back to a plain local split everywhere
# else, so nothing changes for local work. split_vertical's default was
# prefix+v (remapped to prefix+\ before this), split_horizontal's was
# prefix+minus.
split_vertical = ""
split_horizontal = ""
# Moved off its default prefix+r (see `herdr --default-config`) to free
# that up for the reviewr toggle below - resize is used less often and
# doesn't need a mnemonic letter the way reviewr's "r" does.
resize_mode = "prefix+v"

# Unset by default. Direct (no prefix) bindings, not prefix+X - needs to
# work while a Claude session or Neovim has focus, same as vim-herdr-
# navigation's ctrl+hjkl below: herdr grabs direct bindings at the
# multiplexer level before the foreground process ever sees the
# keystroke, same mechanism, not something special-cased per binding.
# alt+shift, not plain alt / ctrl+alt / super: plain alt+j encodes as
# ESC j, so a fast Esc-then-j/k (leaving vim insert mode, escaping a TUI)
# read as alt+j/k and triggered "random" workspace jumps. ctrl+alt+j and
# super+j never registered at all - legacy terminal encoding has no
# distinct sequence for them on letter keys. alt+shift+j (ESC J) does
# register; known tradeoff: a fast Esc-then-J (e.g. escaping vim then
# joining lines) can still misfire the same way plain alt did.
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"

[[keys.command]]
key = "shift+left"
type = "shell"
command = "herdr pane resize --direction left --current --amount 0.02"
description = "resize pane left (tmux-style)"

[[keys.command]]
key = "shift+right"
type = "shell"
command = "herdr pane resize --direction right --current --amount 0.02"
description = "resize pane right (tmux-style)"

[[keys.command]]
key = "shift+up"
type = "shell"
command = "herdr pane resize --direction up --current --amount 0.02"
description = "resize pane up (tmux-style)"

[[keys.command]]
key = "shift+down"
type = "shell"
command = "herdr pane resize --direction down --current --amount 0.02"
description = "resize pane down (tmux-style)"

[[keys.command]]
# Replaces core split_vertical (unbound above): remote-aware split via the
# mirror plugin - splits the remote pane inside a mirrored workspace,
# plain local split anywhere else.
key = "prefix+\\"
type = "plugin_action"
command = "mirror.remote-split-right"
description = "split right (remote-aware)"

[[keys.command]]
# Replaces core split_horizontal (unbound above), same remote-aware deal.
key = "prefix+minus"
type = "plugin_action"
command = "mirror.remote-split-down"
description = "split down (remote-aware)"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "cmd+g"
type = "plugin_action"
command = "chmarax.gitview.toggle"
description = "git view"

[[keys.command]]
# resize_mode above was moved off prefix+r onto prefix+v to make room for
# this. (The earlier "doesn't work in the Claude pane" turned out to be
# unrelated to any of this - reviewr correctly refuses outside a git repo,
# and this session's cwd is ~/code, not a repo itself: `herdr plugin log
# list --plugin persiyanov.reviewr` showed the real stderr.)
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review panel"

[update]
channel = "preview"
