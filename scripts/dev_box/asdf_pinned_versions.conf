# asdf pinned versions
#
# asdf_cleanup_old_versions (lib/asdf_util.sh) uninstalls everything except
# the current global version and the single latest installed version of
# each tool. List a version here to keep it installed too, e.g. because a
# project still pins to it via .tool-versions.
#
# One "<tool> <version>" pair per line, using the plugin name
# (ruby/nodejs/erlang/elixir/python/golang/pnpm/lefthook) and the exact
# version string `asdf list <tool>` prints. Blank lines and lines starting
# with # are ignored.
#
# Example:
#   nodejs 18.20.4

nodejs 26.5.0
pnpm 11.17.0
